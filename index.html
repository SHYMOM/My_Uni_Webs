<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h2>Registration Form</h2>
    <hr><br>
    <form action="#" method="post">
        <div>
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter Name">
        </div>
        <br>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="abc@gmail.com" required>
        </div>
        <br>
        <div>
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="+8801234567890" required>
        </div>
        <br>
        <div>
            <label for="gender">Gender: </label>
            <input type="radio" name="gender" id="gender" value="male">
            <label>Male</label>
            <input type="radio" name="gender" id="female" value="female">
            <label>Female</label>
            <input type="radio" name="gender" id="notsay" value="notsay">
            <label>Prefer not to say</label>
        </div>
        <br>
        <div>
            <label for="dob">Date of Birth</label>
            <input type="date" name="dob" id="dob" required>
        </div>
        <br>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" minlength="8">
            <br><br>
            <label for="conpassword">Password</label>
            <input type="password" id="conpassword" name="conpassword" placeholder="Confirm password" minlength="8">
        </div>
        <br>
        <div>
            <label for="address">Address</label>
            <input type="address" id="address" name="address" placeholder="Address">
        </div>
        <br>
        <div>
            <label for="department">Department: </label>
            <select name="department" id="department">
                <option value="CSE">CSE</option>
                <option value="EEE">EEE</option>
                <option value="BBA">BBA</option>
                <option value="English">English</option>
            </select>
        </div>
        <br>
        <div>
            <input type="checkbox" name="terms" id="terms" required>
            <label for="terms">I Agree With The Terms & Conditions</label>
        </div>
        <br>
        <div>
            <input type="reset" name="reset" id="reset">
            <input type="submit" name="submit" id="reset">
        </div>
    </form>
</body>
</html>
